[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paystack-webhook"
version = "0.3.0"
description = "Verify Paystack and Flutterwave webhooks in Python: HMAC-SHA512, idempotency, replay-safe retries. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mgkvibez" }]
keywords = ["paystack", "flutterwave", "webhooks", "payments", "africa", "nigeria", "hmac", "fastapi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Framework :: FastAPI",
  "Framework :: Flask",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "fastapi>=0.110", "httpx>=0.27", "flask>=3.0", "ruff>=0.4", "build>=1.0"]

[project.scripts]
paystack-webhook = "paystack_webhooks.cli:main"

[project.urls]
Homepage = "https://github.com/mgkvibez/paystack-webhooks"
Issues = "https://github.com/mgkvibez/paystack-webhooks/issues"

[tool.setuptools.packages.find]
include = ["paystack_webhooks*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
